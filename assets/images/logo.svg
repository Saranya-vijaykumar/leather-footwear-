<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Leather Gradient -->
    <radialGradient id="leatherGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3A1C0A" />
      <stop offset="55%" stop-color="#221005" />
      <stop offset="100%" stop-color="#0F0702" />
    </radialGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2DB" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C1E" />
      <stop offset="100%" stop-color="#F4D984" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#9C721D" />
      <stop offset="100%" stop-color="#F4D984" />
    </linearGradient>

    <!-- Drop Shadow for Monogram -->
    <filter id="monogramShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Outer Shadow -->
  <circle cx="256" cy="256" r="240" fill="#000000" opacity="0.35" filter="blur(8px)" />

  <!-- Main Leather Disc -->
  <circle cx="256" cy="256" r="236" fill="url(#leatherGrad)" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Inner Stitch Ring (Dotted luxury cordwainer stitch) -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6,5" opacity="0.85" />

  <!-- Second Concentric Thin Gold Ring -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Artisan Cordwainer Crest Monogram "VV" -->
  <g filter="url(#monogramShadow)" transform="translate(256, 260) scale(1.05)">
    <!-- First V (Left) -->
    <path d="M -115 -105 L -72 -105 L -26 35 L 20 -105 L 62 -105 L -8 75 L -45 75 Z" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Second V (Right, Interlocking / Layered) -->
    <path d="M -60 -105 L -18 -105 L 28 35 L 74 -105 L 115 -105 L 46 75 L 8 75 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Subtle Est. 1974 Luxury Label -->
  <text x="256" y="380" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="8" fill="url(#goldGrad)" text-anchor="middle" opacity="0.95">EST. 1974</text>
  
  <!-- Tiny Gold Star Accent Under Monogram -->
  <polygon points="256,335 259,343 268,343 261,348 263,356 256,351 249,356 251,348 244,343 253,343" fill="url(#goldGrad)" />
</svg>